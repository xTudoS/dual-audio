# Builds a debug APK on every push and pull request, to check the project still compiles.
# The APK is attached to the run as an artifact (downloading requires a GitHub login).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: DualAudio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
