# Pushing a tag like v1.2.3 builds a signed release APK and publishes it on the
# repository's Releases page, so anyone can install Dual Audio without the Android SDK.
#
# One-time setup (maintainer)
# ---------------------------
# Every release must be signed with the SAME key, or Android refuses to update an installed
# copy. Create it once and back it up; *.jks / *.keystore are git-ignored.
#
#   keytool -genkeypair -v -storetype PKCS12 -keystore dualaudio-release.jks \
#     -alias dualaudio -keyalg RSA -keysize 4096 -validity 10000
#
# Repository secrets (Settings → Secrets and variables → Actions):
#
#   base64 -i dualaudio-release.jks | gh secret set DUALAUDIO_KEYSTORE_BASE64
#   gh secret set DUALAUDIO_KEYSTORE_PASSWORD
#   gh secret set DUALAUDIO_KEY_ALIAS --body dualaudio
#   gh secret set DUALAUDIO_KEY_PASSWORD        # PKCS12: same as the keystore password
#
# Publishing
# ----------
# Bump versionCode in app/build.gradle.kts first (Android and Shizuku need it to increase), then:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag becomes versionName (1.0.0). To sign locally, export the same DUALAUDIO_* variables,
# with DUALAUDIO_KEYSTORE_FILE pointing at the .jks, and run ./gradlew :app:assembleRelease.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DUALAUDIO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::DUALAUDIO_KEYSTORE_BASE64 secret is not set (see the setup notes at the top of release.yml)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          DUALAUDIO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DUALAUDIO_KEYSTORE_PASSWORD: ${{ secrets.DUALAUDIO_KEYSTORE_PASSWORD }}
          DUALAUDIO_KEY_ALIAS: ${{ secrets.DUALAUDIO_KEY_ALIAS }}
          DUALAUDIO_KEY_PASSWORD: ${{ secrets.DUALAUDIO_KEY_PASSWORD }}
          DUALAUDIO_VERSION_NAME: ${{ github.ref_name }}
        run: |
          export DUALAUDIO_VERSION_NAME="${DUALAUDIO_VERSION_NAME#v}"
          ./gradlew :app:assembleRelease

      - name: Collect APK and checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DualAudio-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Dual Audio $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
